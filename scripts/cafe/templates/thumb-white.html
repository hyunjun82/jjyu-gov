<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  카페 썸네일 고정 틀 (1024×1024) — 디자인은 이 파일 하나에서만 바꾼다.
  글마다 바뀌는 자리는 {{BIG}} {{HEAD}} {{SMALL}} {{SOURCE}} 네 곳뿐이다 (미리캔버스·캔바의 "텍스트만 교체"와 같은 방식).
  - BIG   큰 숫자·핵심 (예: 3년 → 2년)      - HEAD  한 줄 제목 (예: 일시적 2주택 처분 기한)
  - SMALL 보조 문구(없으면 줄이 사라진다)    - SOURCE 출처(없으면 줄이 사라진다)
  색·글꼴·여백은 아래 :root 값만 고치면 된다.
-->
<style>
  :root{
    --bg:#f5f7fb;          /* 바깥 배경 */
    --card:#ffffff;        /* 카드(고정 박스) 배경 */
    --accent:#1452d4;      /* 큰 숫자 색 */
    --text:#1a2233;        /* 제목 색 */
    --muted:#5b6577;       /* 보조 문구 색 */
    --faint:#98a2b3;       /* 출처 색 */
    --radius:44px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1024px;height:1024px;background:var(--bg);font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;
       color:var(--text);display:flex;align-items:center;justify-content:center}
  .card{width:904px;height:904px;background:var(--card);border-radius:var(--radius);box-shadow:0 10px 40px rgba(20,40,90,.08);
        display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 70px}
  .big{font-size:{{BIG_SIZE}}px;font-weight:900;color:var(--accent);line-height:1.1;word-break:keep-all;letter-spacing:-2px}
  .head{margin-top:56px;font-size:60px;font-weight:800;line-height:1.3;word-break:keep-all;letter-spacing:-1px}
  .small{margin-top:30px;font-size:38px;font-weight:500;color:var(--muted);line-height:1.45;word-break:keep-all}
  .src{margin-top:60px;font-size:28px;color:var(--faint)}
</style>
</head>
<body>
  <div class="card">
    <div class="big">{{BIG}}</div>
    <div class="head">{{HEAD}}</div>
    {{SMALL_BLOCK}}
    {{SOURCE_BLOCK}}
  </div>
</body>
</html>
