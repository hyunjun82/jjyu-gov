            - paragraph [ref=e144]: 2. 자본시장의 공정성과 투명성을 위한 제도가 개선됩니다
            - paragraph [ref=e145]
            - table [ref=e146]:
              - rowgroup [ref=e147]:
                - 'row "➊ (자기주식 공시 제도개선) 상장법인이 자기주식을 발행주식 총수의 1% 이상 보유하는 경우, 자기주식 보유현황·처리계획 등을 연 2회 공시하고 기존에 공시한 자기주식 처리계획과 실제 처리현황이 다른 경우 그 사유를 공시하게 됩니다. (‘25.12.30.) ➋ (중대재해 공시 강화) 사업보고서·반기보고서에 발생개요, 피해상황, 대응조치 및 전망 등 중대재해 발생사실에 대한 공시가 의무화됩니다. (‘25.12.30.) ➌ (임원보수 공시 강화) 임원보수 등에 대한 정보제공 강화를 위해 사업보고서·반기보고서에 총주주수익률(TSR) 및 영업이익 등 기업성과를 임원 전체 보수총액 서식에 병기합니다. (‘26.3.1.) - 또한, 임원 전체·개인별 보수공시서식에 주식기준보상도 함께 공시(미실현 주식기준보상 현금환산액 병기)합니다. * Restricted Stocks : 일정조건(가득조건) 달성시 양도제한이 해제되는 주식 → 주식이 지급되기 전까지는 보수총액(보수지급금액)에 미포함 ➍ (상장사 영문공시 확대) 영문공시 의무 대상법인이 자산 10조원 이상 등 대규모 코스피 상장사에서 자산 2조원 이상 코스피 상장사로 확대됩니다. (‘26.5.1.) ➎(손익계산서 개편) K-IFRS에 따른 기업의 손익계산서 표시방식이‘영업/영업외손익’에서‘영업/투자/재무손익’으로 변경됩니다. (‘27년부터 적용하되, ’26년 조기적용 가능) - 아울러, 영업손익 산정방식도 ‘기업의 주된 사업활동 관련 손익’에서 ‘투자·재무가 아닌 잔여개념’으로 변경됩니다." [ref=e148]':
