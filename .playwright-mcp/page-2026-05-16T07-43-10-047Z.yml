            - paragraph [ref=e127]
            - paragraph [ref=e128]: 1. 생산적 영역으로 자금흐름의 물꼬 전환이 본격화됩니다.
            - paragraph [ref=e129]
            - table [ref=e130]:
              - rowgroup [ref=e131]:
                - row "➊ (첨단산업지원) ‘국민성장펀드’가 대한민국 미래를 이끌 첨단전략산업과 관련 생태계 전반에 연간 30조원의 자금 지원을 개시합니다. ➋ (주담대 위험가중치 조정) 부동산 시장으로의 과도한 자금 쏠림 완화 등 생산적 금융 추진을 위해 은행권 주택담보대출에 대한 위험가중치 하한을 상향(15% → 20%) 조정합니다. (‘26.1.1.) ➌(BDC 도입) 벤처‧혁신기업에 주로 투자하는 상장 공모펀드인 기업성장집합투자기구(BDC) 도입 관련 자본시장법이 시행됩니다. (‘26.3.17.) ➍(주신보 출연요율 개편) 고액 주택담보대출에 대한 관리를 강화하기 위해 현행 대출종류에 따라 차등 부과되는 주신보 출연료율을 대출금액에 따라 차등 부과하는 방식으로 개편합니다. (’26.4.1.) ➎ (지방 금융공급 확대) 지방공급 확대 목표제를 통해 비수도권 정책금융 비중을 ’26년 41.7%(’25년 40%)로 확대하여 금융이 지방균형발전을 견인합니다." [ref=e132]:
