        - generic [ref=e89]:
          - heading "「취약계층 특별요금 지원제도」란 무엇인가요?" [level=3] [ref=e90]
          - paragraph [ref=e91]:
            - text: 한국지역난방공사는 에너지 요금의 급격한 상승으로 어려움을 겪으신 취약계층을 위하여
            - text: 지난해에 이어 올해도 동절기 4개월간(’25.12.~’26.3.) 의 난방비 일부를 지원하는 한시적 제도입니다.
          - paragraph [ref=e92]: 특히, 금년도 사업은 고객님의 편의를 위해 절차 및 서류가 간소화된 정액지원 방식으로 개편되었습니다. 난방비 고지서 제출이 생략됨에 따라 신속하게 지원금을 지급할 예정입니다.
          - paragraph [ref=e93]:
            - link "취약계층 특별요금 지원 신청·변경" [ref=e94] [cursor=pointer]:
              - /url: /cyb/heat/fss/aply/fssAplyChooseTypeForm.do?menuCode=M020377
          - heading "지원 대상은 어떻게 되나요?" [level=3] [ref=e95]
          - paragraph [ref=e96]: 한국지역난방공사에서 지역난방을 공급하는 아파트, 오피스텔 등에 거주(주민등록등본 상)하는 취약계층(기초생활수급자, 차상위계층) 고객님을 대상으로 합니다.
          - list [ref=e97]:
            - listitem [ref=e98]:
              - text: 한국지역난방공사 공급 지역 [클릭을 누르면 펼쳐집니다.]
              - paragraph [ref=e99]: 표는 고객님의 이해를 돕기 위한 것으로, 해당 지역에 속하더라도 한국지역난방공사에서 지역난방을 공급하지 않는 아파트, 건물 등이 있습니다. 자세한 공급지역 여부는 고객센터(1688-2488)로 연락하시어 자세한 안내를 받으시기 바랍니다.
            - listitem [ref=e100]:
              - text: 지원대상 취약계층
              - list [ref=e101]:
                - listitem [ref=e102]: 국민기초생활보장법 제7조 제1항 제1호(생계급여), 제3호(의료급여) 수급자
                - listitem [ref=e103]: 국민기초생활보장법 제7조 제1항 제2호(주거급여), 제4호(교육급여) 수급자
                - listitem [ref=e104]:
                  - text: 다음 법령에 따라 지원 받는 차상위계층 또는 차상위계층에 준하는 자로서 사업자가 인정하는 자
                  - list [ref=e105]:
                    - listitem [ref=e106]: ① 국민기초생활보장법 제9조 제5항
                    - listitem [ref=e107]: ② 국민건강보험법 시행령 별표2 제3호 라목
                    - listitem [ref=e108]: ③ 장애인복지법 제49조, 제50조
                    - listitem [ref=e109]: ④ 한부모가족지원법 제5조
                    - listitem [ref=e110]: ⑤ 국민기초생활보장법 시행령 제3조(舊 차상위 우선돌봄)
          - heading "지원 내용은 어떻게 되나요?" [level=3] [ref=e111]
          - paragraph [ref=e112]: 지원대상 고객님께서 ’25년 12월부터 ’26년 3월(’26년 1월 고지서~’26년 4월 고지서)까지 사용한 난방비 일부에 대해 에너지바우처 미수혜자의 경우 최대 29만 2천원(월 7만 3천원), 수혜자의 경우 최대 14만 4천원(월 3만 6천원)을 지원해드립니다.
          - paragraph [ref=e113]: ※ 취약계층 세대 거주 비율이 높은 영구임대 아파트는 ’25년 12월부터 ’26년 3월까지 사용하신 요금에 대해 자동 감면을 통해 취약계층 특별요금을 지원하였으므로, 별도 특별요금 신청을 하실 필요가 없으니 신청 시 참고하시기 바랍니다.
          - paragraph [ref=e114]: 기 감면 영구임대 아파트 목록 확인 [클릭을 누르면 펼쳐집니다.]
          - heading "유의사항" [level=4] [ref=e115]
          - list [ref=e116]:
            - listitem [ref=e117]: ① 지원금액은 에너지바우처 수혜 여부와 지원 대상 기간 중 거주 기간에 따라 차등 지급됩니다.
            - listitem [ref=e118]: ② 지역난방 공동주택 거주기간 및 자격 보유 기간에 따라 차등하여 지급하며, 월 1/2 이상 거주 및 자격 보유 시에 해당 월의 지원대상으로 인정합니다.
