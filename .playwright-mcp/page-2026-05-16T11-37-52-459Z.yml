            - paragraph [ref=e156]: 지역난방 아파트 거주기간 및 자격 보유기간에 따라 차등하여 지급하며, 월 1/2 이상 거주 및 자격 보유시 해당 월 지원대상으로 인정합니다.
            - heading "신청방법과 유의사항은 어떻게 되나요?" [level=3] [ref=e157]
            - list [ref=e158]:
              - listitem [ref=e159]: "신청방법 : ①한국지역난방공사 홈페이지에서 온라인 신청 ②고객상담센터(1688-2488)를 통한 유선 신청 및 ③읍·면·동 행정복지센터 방문 신청을 통해 연중 신청이 가능합니다. 다만, 매년 04월 30일 이후 신청자는 다음 연도부터 지원해드리고 있습니다."
              - listitem [ref=e160]: "제출서류 : 개인정보·고유식별정보 수집 및 이용, 행정정보공동이용에 사전 동의하신 경우 증빙 서류 제출을 생략합니다."
              - listitem [ref=e161]:
                - text: "유의사항 :"
                - list [ref=e162]:
                  - listitem [ref=e163]: 한번 신청하신 경우 매년 자동으로 신청이 갱신되나, 이사, 사망, 개명, 자격변동, 계좌변경 등이 있으신 경우 반드시 변경 신청해주셔야 합니다.
                  - listitem [ref=e164]: 동일 세대·주소 내 중복 지원은 불가하며, 중복 신청시 상위자격으로 지원됩니다.
